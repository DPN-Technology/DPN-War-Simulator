<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07080B"/><stop offset="1" stop-color="#0D090D"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".022"/></pattern></defs><rect width="1200" height="350" rx="20" fill="url(#bg)"/><rect width="1200" height="350" rx="20" fill="url(#grid)"/><text x="74" y="53" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#FF5A36" letter-spacing="3">REPOSITORY AT A GLANCE</text><text x="74" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F4F4F6">Large-scale military and shipboard simulation</text><g transform="translate(75 112)"><rect width="510" height="78" rx="12" fill="#0D0E12" stroke="#FF5A36" stroke-opacity=".22"/><rect width="4" height="78" rx="2" fill="#FF5A36" opacity=".75"/><text x="22" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#F2F2F5">TACTICAL SIMULATION</text><text x="22" y="53" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8C8F99">Command, combat and decision-driven scenarios</text></g><g transform="translate(635 112)"><rect width="510" height="78" rx="12" fill="#0D0E12" stroke="#FF5A36" stroke-opacity=".22"/><rect width="4" height="78" rx="2" fill="#FF5A36" opacity=".75"/><text x="22" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#F2F2F5">SHIPBOARD SYSTEMS</text><text x="22" y="53" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8C8F99">Interactive ships, spaces, crew and damage systems</text></g><g transform="translate(75 216)"><rect width="510" height="78" rx="12" fill="#0D0E12" stroke="#FF5A36" stroke-opacity=".22"/><rect width="4" height="78" rx="2" fill="#FF5A36" opacity=".75"/><text x="22" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#F2F2F5">CAREER PROGRESSION</text><text x="22" y="53" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8C8F99">Academy, service record and persistent career</text></g><g transform="translate(635 216)"><rect width="510" height="78" rx="12" fill="#0D0E12" stroke="#FF5A36" stroke-opacity=".22"/><rect width="4" height="78" rx="2" fill="#FF5A36" opacity=".75"/><text x="22" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#F2F2F5">WORLD SYSTEMS</text><text x="22" y="53" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8C8F99">Vehicles, historical operations and expanding environments</text></g><rect x="1" y="1" width="1198" height="348" rx="19" fill="none" stroke="#FF5A36" stroke-opacity=".18"/></svg>