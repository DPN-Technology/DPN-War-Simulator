name: Supply Chain

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/supply-chain.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ -n "$RELEASE_EVENT_TAG" ]; then
            tag="$RELEASE_EVENT_TAG"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $tag"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Generate SPDX SBOM and dependency snapshot
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx
          dependency-snapshot: true
          upload-release-assets: false
          syft-version: v1.51.0

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx
          dependency-snapshot: false
          upload-release-assets: false
          syft-version: v1.51.0

      - name: Create SBOM checksums
        shell: bash
        run: |
          sha256sum sbom.spdx.json sbom.cyclonedx.json > SBOM_SHA256SUMS.txt
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Release tag: ${{ steps.release.outputs.tag }}"
            echo "Release commit: $(git rev-parse HEAD)"
            echo "Syft: v1.51.0"
            echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > SBOM_MANIFEST.txt

      - name: Attach SBOMs to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG"             sbom.spdx.json             sbom.cyclonedx.json             SBOM_SHA256SUMS.txt             SBOM_MANIFEST.txt             --clobber

      - name: Supply-chain summary
        shell: bash
        run: |
          {
            echo "## Supply-chain inventory"
            echo ""
            echo "- Release: `${{ steps.release.outputs.tag }}`"
            echo "- SPDX JSON SBOM generated"
            echo "- CycloneDX JSON SBOM generated"
            echo "- GitHub dependency snapshot submitted"
            echo "- SHA-256 checksums attached to the release"
          } >> "$GITHUB_STEP_SUMMARY"
