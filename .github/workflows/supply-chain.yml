name: Supply Chain

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "41 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject tracked runtime secrets and private state
        shell: bash
        run: |
          sensitive="$(git ls-files | grep -Ei '(^|/)\.env$|(^|/)(vault|master)[^/]*\.key$|(^|/)FIRST_RUN_LOGIN\.txt$|(^|/)data/.*\.(sqlite|sqlite3|db|enc)$|(^|/)backups/|(^|/)runtime_logs/|(^|/)install_logs/|(^|/)workspace/generated/|(^|/)workspace/uploads/' || true)"
          test -z "$sensitive" || { echo "::error::Sensitive/runtime files are tracked:"; echo "$sensitive"; exit 1; }

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: SBOM.spdx.json
          upload-artifact: false

      - name: Generate build provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform
          from datetime import datetime, timezone

          doc = {
              "schema": "dpn-provenance/v1",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "ref_name": os.environ.get("GITHUB_REF_NAME"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "python": platform.python_version(),
              "generated_utc": datetime.now(timezone.utc).isoformat(),
          }
          with open("PROVENANCE.json", "w", encoding="utf-8") as f:
              json.dump(doc, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

      - name: Generate checksums
        shell: bash
        run: sha256sum SBOM.spdx.json PROVENANCE.json > SUPPLY_CHAIN_SHA256SUMS.txt

      - name: Validate generated supply-chain files
        shell: bash
        run: |
          python -m json.tool SBOM.spdx.json >/dev/null
          python -m json.tool PROVENANCE.json >/dev/null
          sha256sum -c SUPPLY_CHAIN_SHA256SUMS.txt

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            SBOM.spdx.json
            PROVENANCE.json
            SUPPLY_CHAIN_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
