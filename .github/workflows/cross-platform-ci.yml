name: Cross-Platform CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-matrix:
    name: ${{ matrix.os_name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Ubuntu
            python: "3.11"
          - os: ubuntu-latest
            os_name: Ubuntu
            python: "3.12"
          - os: windows-latest
            os_name: Windows
            python: "3.11"
          - os: windows-latest
            os_name: Windows
            python: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install simulation test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Run portable repository guard
        run: python .github/scripts/ci_cross_platform_guard.py

      - name: Compile Python sources
        run: python -m compileall -q warsim tests main.py WarSimulator.pyw .github/scripts

      - name: Run simulation regression tests
        run: python -m pytest -q tests

      - name: Phase 4 matrix summary
        shell: python
        run: |
          import os
          from pathlib import Path
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "## War Simulator Phase 4\n"
              f"- Runner: {os.environ.get('RUNNER_OS', 'unknown')}\n"
              f"- Python: {os.sys.version.split()[0]}\n"
              "- Portable guard: passed\n"
              "- Compile validation: passed\n"
              "- Simulation regression suite: passed\n",
              encoding="utf-8",
          )
