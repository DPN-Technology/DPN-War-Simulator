name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject tracked runtime secrets
        shell: bash
        run: |
          sensitive="$(git ls-files | grep -Ei '(^|/)\.env$|(^|/)(vault|master)[^/]*\.key$|(^|/)FIRST_RUN_LOGIN\.txt$|(^|/)data/.*\.(sqlite|sqlite3|db|enc)$|(^|/)backups/' || true)"
          if [ -n "$sensitive" ]; then
            echo "Sensitive/runtime files must not be tracked:"
            echo "$sensitive"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q warsim tests main.py WarSimulator.pyw

      - name: Run simulation tests
        run: pytest -q tests
