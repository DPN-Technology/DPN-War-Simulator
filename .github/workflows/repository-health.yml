name: Repository Health

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "SECURITY.md"
      - "SUPPLY_CHAIN.md"
      - "RELEASE_PROCESS.md"
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify required repository standards
        shell: bash
        run: |
          required=(
            README.md
            SECURITY.md
            CONTRIBUTING.md
            SUPPORT.md
            PROPRIETARY_NOTICE.md
            RELEASE_PROCESS.md
            ROADMAP.md
            CHANGELOG.md
            SUPPLY_CHAIN.md
            .github/CODEOWNERS
            .github/scripts/generate_supply_chain.py
            .github/dependabot.yml
            .github/workflows/ci.yml
            .github/workflows/security-gate.yml
            .github/workflows/runtime-assurance.yml
            .github/workflows/release.yml
            .github/workflows/supply-chain.yml
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/bug_report.yml
            .github/ISSUE_TEMPLATE/feature_request.yml
            .github/ISSUE_TEMPLATE/security_or_infrastructure.yml
            .github/ISSUE_TEMPLATE/config.yml
          )
          failed=0
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required repository standard: $file"
              failed=1
            fi
          done
          exit "$failed"

      - name: Enforce immutable GitHub Action references and checkout credential isolation
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          workflows = sorted(Path(".github/workflows").glob("*.y*ml"))
          uses_re = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)")
          sha_re = re.compile(r"^[0-9a-fA-F]{40}$")
          failures = []

          for workflow in workflows:
              lines = workflow.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  match = uses_re.match(line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith("./") or reference.startswith("docker://"):
                      continue
                  if "@" not in reference:
                      failures.append(f"{workflow}:{index + 1}: action reference has no immutable ref: {reference}")
                      continue
                  action, ref = reference.rsplit("@", 1)
                  if not sha_re.fullmatch(ref):
                      failures.append(f"{workflow}:{index + 1}: action is not pinned to a 40-character commit SHA: {reference}")
                  if action == "actions/checkout":
                      window = "\n".join(lines[index + 1:index + 8])
                      if not re.search(r"^\s+persist-credentials:\s*false\s*(?:#.*)?$", window, re.MULTILINE):
                          failures.append(f"{workflow}:{index + 1}: actions/checkout must set persist-credentials: false")

          if failures:
              print("GitHub Actions policy violations:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated immutable action references and checkout credential isolation across {len(workflows)} workflows")

      - name: Reject tracked runtime secrets and private state
        shell: bash
        run: |
          sensitive="$(git ls-files | grep -Ei '(^|/)\.env$|(^|/)(vault|master)[^/]*\.key$|(^|/)FIRST_RUN_LOGIN\.txt$|(^|/)data/.*\.(sqlite|sqlite3|db|enc)$|(^|/)backups/|(^|/)runtime_logs/|(^|/)install_logs/' || true)"
          if [ -n "$sensitive" ]; then
            echo "::error::Sensitive/runtime files are tracked:"
            echo "$sensitive"
            exit 1
          fi

      - name: Detect unresolved merge conflicts
        shell: bash
        run: |
          conflicts="$(git grep -n -E '^(<<<<<<< |>>>>>>> )' -- ':!*.md' || true)"
          if [ -n "$conflicts" ]; then
            echo "::error::Possible unresolved merge-conflict markers detected:"
            echo "$conflicts"
            exit 1
          fi

      - name: Flag Git-hostile files over 95 MB
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            size="$(stat -c%s "$file")"
            if [ "$size" -gt 99614720 ]; then
              echo "::error file=$file::Tracked file exceeds 95 MB ($size bytes). Use an approved release artifact or Git LFS strategy."
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"
